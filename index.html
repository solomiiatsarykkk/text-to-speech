<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Text to Speech</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6e0d25, #774e24);
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #ffffb3;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      color: #6e0d25;
      margin-bottom: 12px;
      font-size: 34px;
    }

    .subtitle {
      text-align: center;
      color: #6a381f;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      height: 170px;
      resize: none;
      border: 2px solid #dcab6b;
      border-radius: 18px;
      padding: 18px;
      font-size: 16px;
      outline: none;
      color: #6e0d25;
      margin-bottom: 20px;
      transition: 0.3s;
    }

    textarea:focus {
      border-color: #774e24;
      box-shadow: 0 0 0 4px rgba(119, 78, 36, 0.15);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 25px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      color: #6e0d25;
      font-weight: bold;
      font-size: 15px;
    }

    select,
    input[type="range"] {
      width: 100%;
    }

    select {
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #dcab6b;
      background: white;
      font-size: 15px;
      color: #6e0d25;
      outline: none;
    }

    .speed-value {
      text-align: right;
      color: #774e24;
      font-size: 14px;
      margin-top: 5px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: #774e24;
      color: #ffffb3;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: #6a381f;
      transform: scale(1.03);
    }

    /* Активний стан */
    button.speaking {
      background: #6e0d25;
      animation: pulse 1.2s infinite;
    }

    /* Хвиля */
    .wave {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-top: 18px;
      height: 30px;
    }

    .wave.active {
      display: flex;
    }

    .wave span {
      width: 6px;
      height: 12px;
      background: #6e0d25;
      border-radius: 10px;
      animation: wave 1s infinite ease-in-out;
    }

    .wave span:nth-child(2) {
      animation-delay: 0.1s;
    }

    .wave span:nth-child(3) {
      animation-delay: 0.2s;
    }

    .wave span:nth-child(4) {
      animation-delay: 0.3s;
    }

    .wave span:nth-child(5) {
      animation-delay: 0.4s;
    }

    @keyframes wave {
      0%, 100% {
        transform: scaleY(1);
      }

      50% {
        transform: scaleY(2.5);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(110, 13, 37, 0.4);
      }

      70% {
        box-shadow: 0 0 0 15px rgba(110, 13, 37, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(110, 13, 37, 0);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 28px;
      }

      textarea {
        height: 150px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Text to Speech</h1>

    <p class="subtitle">
      Введіть текст, оберіть голос та швидкість мовлення
    </p>

    <textarea
      id="text"
      placeholder="Введіть текст..."
    ></textarea>

    <div class="controls">

      <div class="control-group">
        <label for="voices">Оберіть голос</label>

        <select id="voices"></select>
      </div>

      <div class="control-group">
        <label for="speed">
          Швидкість мовлення
        </label>

        <input
          type="range"
          id="speed"
          min="0.5"
          max="2"
          step="0.1"
          value="1"
        />

        <div class="speed-value">
          <span id="speedValue">1</span>x
        </div>
      </div>

    </div>

    <button id="speakBtn">
      Слухати
    </button>

    <!-- Анімація хвилі -->
    <div class="wave" id="wave">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>

  <script>
    const textInput = document.getElementById('text');
    const voicesSelect = document.getElementById('voices');
    const speedInput = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');
    const speakBtn = document.getElementById('speakBtn');
    const wave = document.getElementById('wave');

    let voices = [];

    // Завантаження голосів
    function loadVoices() {
      voices = speechSynthesis.getVoices();

      voicesSelect.innerHTML = '';

      voices.forEach((voice, index) => {
        const option = document.createElement('option');

        option.value = index;

        option.textContent =
          `${voice.name} (${voice.lang})`;

        voicesSelect.appendChild(option);
      });
    }

    loadVoices();

    speechSynthesis.onvoiceschanged = loadVoices;

    // Оновлення швидкості
    speedInput.addEventListener('input', () => {
      speedValue.textContent = speedInput.value;
    });

    // Озвучення тексту
    speakBtn.addEventListener('click', () => {
      const text = textInput.value.trim();

      if (!text) {
        alert('Введіть текст');
        return;
      }

      // Зупинити попереднє озвучення
      speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(text);

      utterance.voice =
        voices[voicesSelect.value];

      utterance.rate =
        parseFloat(speedInput.value);

      // Початок читання
      utterance.onstart = () => {
        speakBtn.textContent = 'Читається...';
        speakBtn.classList.add('speaking');
        wave.classList.add('active');
      };

      // Кінець читання
      utterance.onend = () => {
        speakBtn.textContent = 'Слухати';
        speakBtn.classList.remove('speaking');
        wave.classList.remove('active');
      };

      speechSynthesis.speak(utterance);
    });
  </script>

</body>
</html>
